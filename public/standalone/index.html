<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UniConnect - Student & Alumni Career Network</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome 6 Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="./style.css">
</head>
<body class="bg-slate-50 text-slate-900 font-sans min-h-screen flex flex-col antialiased">

  <!-- TOP NAVIGATION HEADER -->
  <header class="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-slate-300 shadow-xs">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        <!-- Logo -->
        <div onclick="switchTab('jobs')" class="flex items-center gap-3 cursor-pointer group">
          <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-slate-950 via-indigo-900 to-indigo-800 flex items-center justify-center text-white shadow-md shadow-indigo-900/20">
            <i class="fa-solid fa-graduation-cap text-lg"></i>
          </div>
          <div>
            <span class="text-xl font-extrabold tracking-tight text-slate-950">UniConnect</span>
            <span class="text-xs text-indigo-900 font-bold block -mt-1">Student & Alumni Bridge</span>
          </div>
        </div>

        <!-- Desktop Navigation Tabs -->
        <nav class="hidden md:flex items-center space-x-1">
          <button id="nav-btn-profile" onclick="switchTab('profile')" class="px-3.5 py-2 rounded-lg text-sm font-bold bg-indigo-50 text-indigo-700 transition flex items-center gap-1.5">
            <i class="fa-solid fa-user"></i> My Profile
          </button>
          <button id="nav-btn-jobs" onclick="switchTab('jobs')" class="px-3.5 py-2 rounded-lg text-sm font-medium text-slate-700 hover:text-indigo-600 hover:bg-slate-50 transition flex items-center gap-1.5">
            <i class="fa-solid fa-briefcase"></i> Job & Referrals
          </button>
          <button id="nav-btn-directory" onclick="switchTab('directory')" class="px-3.5 py-2 rounded-lg text-sm font-medium text-slate-700 hover:text-indigo-600 hover:bg-slate-50 transition flex items-center gap-1.5">
            <i class="fa-solid fa-users"></i> Directory
          </button>
          <button id="nav-btn-messages" onclick="switchTab('messages')" class="px-3.5 py-2 rounded-lg text-sm font-medium text-slate-700 hover:text-indigo-600 hover:bg-slate-50 transition flex items-center gap-1.5">
            <i class="fa-solid fa-comments"></i> Messages
          </button>
        </nav>

        <!-- Right Side: Account Switcher & Profile -->
        <div class="flex items-center gap-3">
          <!-- 1-Click Role Switcher -->
          <div class="flex items-center bg-slate-100 p-1 rounded-xl border border-slate-300">
            <button onclick="switchUser('student', 'student-alex')" class="px-2.5 py-1 text-xs font-bold rounded-lg bg-white text-slate-950 shadow-xs hover:bg-slate-50 transition">
              <i class="fa-solid fa-user-graduate text-indigo-700 mr-1"></i> Alex (Student)
            </button>
            <button onclick="switchUser('alumni', 'alumni-sarah')" class="px-2.5 py-1 text-xs font-bold rounded-lg text-slate-700 hover:text-slate-950 transition">
              <i class="fa-solid fa-briefcase text-emerald-700 mr-1"></i> Sarah (Alumni)
            </button>
          </div>

          <!-- Active Profile Pill -->
          <div class="flex items-center gap-2 pl-2">
            <img id="nav-user-avatar" src="https://images.unsplash.com/photo-1539571696357-5a69c17a67c6?w=100&auto=format&fit=crop&q=80" class="w-8 h-8 rounded-full object-cover border-2 border-indigo-700" alt="Avatar">
            <div class="hidden sm:block text-left">
              <p id="nav-user-name" class="text-xs font-extrabold text-slate-950">Alex Morgan</p>
              <span id="nav-role-tag" class="text-[11px] font-extrabold uppercase px-1.5 py-0.5 rounded bg-indigo-100 text-indigo-900 border border-indigo-200">STUDENT</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- MAIN TABBED CONTENT AREA -->
  <main class="flex-grow py-8 px-4 sm:px-6 lg:px-8">
    <div id="tab-content-profile"></div>
    <div id="tab-content-jobs" class="hidden"></div>
    <div id="tab-content-directory" class="hidden"></div>
    <div id="tab-content-messages" class="hidden"></div>
  </main>

  <!-- FOOTER -->
  <footer class="border-t border-slate-300 bg-white py-6 mt-12 text-xs text-slate-600">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row justify-between items-center gap-3">
      <div class="flex items-center gap-2">
        <i class="fa-solid fa-graduation-cap text-indigo-700 text-base"></i>
        <span class="font-extrabold text-slate-950">UniConnect</span> · Standalone HTML, CSS, JS Edition
      </div>
      <div>Stanford · MIT · Harvard · Google · Microsoft · Meta Network</div>
    </div>
  </footer>

  <!-- Standalone Script -->
  <script src="./app.js"></script>
</body>
</html>
